name: Integrate canonical MAVLink schema

on:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/mavlink-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mavlink branch
        uses: actions/checkout@v4
        with:
          ref: mavlink
          fetch-depth: 0
          submodules: false

      - name: Install generation and native-test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libgpiod-dev libyaml-cpp-dev libjsoncpp-dev openssl libssl-dev libulfius-dev liborcania-dev libusb-1.0-0-dev libi2c-dev libuv1-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install --no-build-isolation "setuptools<72" platformio "nanopb==0.4.9.1" grpcio-tools

      - name: Pin canonical MAVLink protobuf schema
        shell: bash
        run: |
          git config -f .gitmodules submodule.protobufs.url https://github.com/xznhj8129/meshtastic-protobufs.git
          git submodule sync -- protobufs
          git submodule update --init protobufs
          git -C protobufs remote set-url origin https://github.com/xznhj8129/meshtastic-protobufs.git
          git -C protobufs fetch origin 026b3121dc5ac7bfd236360a3aac6278065d7c47
          git -C protobufs checkout --detach 026b3121dc5ac7bfd236360a3aac6278065d7c47

      - name: Regenerate nanopb bindings
        shell: bash
        run: |
          cd protobufs
          python3 -m grpc_tools.protoc \
            --experimental_allow_proto3_optional \
            --plugin=protoc-gen-nanopb="$(command -v protoc-gen-nanopb)" \
            "--nanopb_out=-S.cpp -v:../src/mesh/generated/" \
            -I=. meshtastic/*.proto

      - name: Integrate generated enum, peer configuration, and battery freshness
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path_name}: {old[:100]!r}")
              path.write_text(text.replace(old, new, 1))

          header = Path("src/modules/SerialModule.h")
          text = header.read_text()
          temporary_alias = '''// Pending Serial_Mode.MAVLINK = 11 in meshtastic/protobufs; nanopb UENUM fields decode and
          // persist out-of-range values, so the raw value works end to end on the device side.
          static constexpr auto Serial_Mode_MAVLINK = static_cast<meshtastic_ModuleConfig_SerialConfig_Serial_Mode>(11);

          '''.replace("          ", "")
          if temporary_alias not in text:
              raise SystemExit("temporary MAVLink enum alias not found")
          header.write_text(text.replace(temporary_alias, "", 1))

          serial_cpp = Path("src/modules/SerialModule.cpp")
          text = serial_cpp.read_text()
          if "Serial_Mode_MAVLINK" not in text:
              raise SystemExit("firmware MAVLink enum uses not found")
          text = text.replace(
              "Serial_Mode_MAVLINK",
              "meshtastic_ModuleConfig_SerialConfig_Serial_Mode_MAVLINK",
          )
          old_ctor = "mavlinkBridge = new MavlinkBridge(mavlinkUart ? serialModuleUart() : nullptr);"
          new_ctor = "mavlinkBridge = new MavlinkBridge(mavlinkUart ? serialModuleUart() : nullptr, moduleConfig.serial.peer_node);"
          if old_ctor not in text:
              raise SystemExit("MavlinkBridge construction site not found")
          serial_cpp.write_text(text.replace(old_ctor, new_ctor, 1))

          replace_once(
              "src/modules/Mavlink/MavlinkBridge.h",
              "    explicit MavlinkBridge(Stream *uart);",
              "    explicit MavlinkBridge(Stream *uart, NodeNum configuredPeer = 0);",
          )
          replace_once(
              "src/modules/Mavlink/MavlinkBridge.h",
              "    uint32_t lastBatteryMs = 0;       // last accepted battery source of either kind\n"
              "    uint32_t lastBatteryStatusMs = 0; // last BATTERY_STATUS (SYS_STATUS defers for SYS_STATUS_DEFER_MS)",
              "    uint32_t lastBatteryLevelMs = 0;   // freshness is tracked independently per field\n"
              "    uint32_t lastBatteryVoltageMs = 0; // HIGH_LATENCY2 must not refresh an old voltage\n"
              "    uint32_t lastBatteryStatusMs = 0;  // last BATTERY_STATUS (SYS_STATUS defers for SYS_STATUS_DEFER_MS)",
          )

          replace_once(
              "src/modules/Mavlink/MavlinkBridge.cpp",
              "MavlinkBridge::MavlinkBridge(Stream *serial) : uart(serial ? serial : &mavlinkNullStream) {}",
              "MavlinkBridge::MavlinkBridge(Stream *serial, NodeNum configuredPeer)\n"
              "    : lockedPeer(configuredPeer), uart(serial ? serial : &mavlinkNullStream)\n"
              "{\n"
              "    if (configuredPeer)\n"
              "        LOG_INFO(\"MAVLink bridge configured for peer 0x%08x\", configuredPeer);\n"
              "}",
          )

          replace_once(
              "src/modules/Mavlink/MavlinkBridge.cpp",
              "        battSnap.hasVoltage = anyCell;\n"
              "        battSnap.voltage = mvSum / 1000.0f;\n"
              "        battSnap.hasLevel = (b.battery_remaining >= 0); // -1 = autopilot does not estimate\n"
              "        if (battSnap.hasLevel)\n"
              "            battSnap.level = (uint8_t)min((int)b.battery_remaining, 100);\n"
              "        lastBatteryStatusMs = now;\n"
              "        lastBatteryMs = now;",
              "        battSnap.hasVoltage = anyCell;\n"
              "        if (anyCell) {\n"
              "            battSnap.voltage = mvSum / 1000.0f;\n"
              "            lastBatteryVoltageMs = now;\n"
              "        }\n"
              "        battSnap.hasLevel = (b.battery_remaining >= 0); // -1 = autopilot does not estimate\n"
              "        if (battSnap.hasLevel) {\n"
              "            battSnap.level = (uint8_t)min((int)b.battery_remaining, 100);\n"
              "            lastBatteryLevelMs = now;\n"
              "        }\n"
              "        lastBatteryStatusMs = now;",
          )

          replace_once(
              "src/modules/Mavlink/MavlinkBridge.cpp",
              "        battSnap.hasVoltage = (s.voltage_battery != UINT16_MAX);\n"
              "        if (battSnap.hasVoltage)\n"
              "            battSnap.voltage = s.voltage_battery / 1000.0f;\n"
              "        battSnap.hasLevel = (s.battery_remaining >= 0);\n"
              "        if (battSnap.hasLevel)\n"
              "            battSnap.level = (uint8_t)min((int)s.battery_remaining, 100);\n"
              "        lastBatteryMs = now;",
              "        battSnap.hasVoltage = (s.voltage_battery != UINT16_MAX);\n"
              "        if (battSnap.hasVoltage) {\n"
              "            battSnap.voltage = s.voltage_battery / 1000.0f;\n"
              "            lastBatteryVoltageMs = now;\n"
              "        }\n"
              "        battSnap.hasLevel = (s.battery_remaining >= 0);\n"
              "        if (battSnap.hasLevel) {\n"
              "            battSnap.level = (uint8_t)min((int)s.battery_remaining, 100);\n"
              "            lastBatteryLevelMs = now;\n"
              "        }",
          )

          replace_once(
              "src/modules/Mavlink/MavlinkBridge.cpp",
              "        lastBatteryMs = now;",
              "        lastBatteryLevelMs = now;",
          )

          replace_once(
              "src/modules/Mavlink/MavlinkBridge.cpp",
              "bool MavlinkBridge::getBatterySnapshot(uint32_t now, MavlinkBatterySnapshot &out) const\n"
              "{\n"
              "    if (!lastBatteryMs || (now - lastBatteryMs) > BATTERY_STALENESS_MS)\n"
              "        return false;\n"
              "    out = battSnap;\n"
              "    return true;\n"
              "}",
              "bool MavlinkBridge::getBatterySnapshot(uint32_t now, MavlinkBatterySnapshot &out) const\n"
              "{\n"
              "    out = battSnap;\n"
              "    out.hasLevel = lastBatteryLevelMs && (now - lastBatteryLevelMs) <= BATTERY_STALENESS_MS;\n"
              "    out.hasVoltage = lastBatteryVoltageMs && (now - lastBatteryVoltageMs) <= BATTERY_STALENESS_MS;\n"
              "    return out.hasLevel || out.hasVoltage;\n"
              "}",
          )

          Path("test/test_mavlink").mkdir(parents=True, exist_ok=True)
          Path("test/test_mavlink/test_main.cpp").write_text(r'''#include "MeshTypes.h"
          #include "TestUtil.h"
          #include <unity.h>

          #if !MESHTASTIC_EXCLUDE_MAVLINK

          #include "modules/Mavlink/MavlinkBridge.h"
          #include <algorithm>

          class TestStream : public Stream
          {
            public:
              int available() override { return 0; }
              int read() override { return -1; }
              int peek() override { return -1; }
              size_t write(uint8_t) override { return 1; }
              size_t write(const uint8_t *, size_t n) override { return n; }
              int availableForWrite() override { return 1024; }
              void flush() override {}
          };

          static void ingestFrame(MavlinkBridge &bridge, const mavlink_message_t &msg, uint32_t now)
          {
              uint8_t bytes[MAVLINK_MAX_PACKET_LEN];
              const uint16_t len = mavlink_msg_to_send_buffer(bytes, &msg);
              bridge.ingestSerialBytes(bytes, len, now);
          }

          static void learnAutopilot(MavlinkBridge &bridge, uint32_t now)
          {
              mavlink_message_t msg;
              mavlink_msg_heartbeat_pack(1, MAV_COMP_ID_AUTOPILOT1, &msg, MAV_TYPE_QUADROTOR, MAV_AUTOPILOT_GENERIC,
                                         MAV_MODE_FLAG_CUSTOM_MODE_ENABLED, 0, MAV_STATE_ACTIVE);
              ingestFrame(bridge, msg, now);
          }

          void test_configured_peer_is_immediate_and_exclusive()
          {
              TestStream stream;
              const NodeNum configured = 0x12345678;
              MavlinkBridge bridge(&stream, configured);
              TEST_ASSERT_EQUAL_HEX32(configured, bridge.getPeer());

              const uint8_t byte = 0xfd;
              bridge.ingestMeshPayload(0x87654321, &byte, 1);
              TEST_ASSERT_EQUAL_UINT32(1, bridge.getStats().rejectedSourceChunks);
              TEST_ASSERT_EQUAL_HEX32(configured, bridge.getPeer());
          }

          void test_zero_peer_keeps_first_sender_discovery()
          {
              TestStream stream;
              MavlinkBridge bridge(&stream);
              TEST_ASSERT_EQUAL_HEX32(0, bridge.getPeer());

              bridge.ingestMeshPayload(0x11111111, nullptr, 0);
              TEST_ASSERT_EQUAL_HEX32(0, bridge.getPeer());

              const uint8_t byte = 0xfd;
              bridge.ingestMeshPayload(0x11111111, &byte, 1);
              TEST_ASSERT_EQUAL_HEX32(0x11111111, bridge.getPeer());
              bridge.ingestMeshPayload(0x22222222, &byte, 1);
              TEST_ASSERT_EQUAL_UINT32(1, bridge.getStats().rejectedSourceChunks);
          }

          void test_high_latency_level_does_not_refresh_stale_voltage()
          {
              TestStream stream;
              MavlinkBridge bridge(&stream);
              learnAutopilot(bridge, 1000);

              mavlink_battery_status_t battery{};
              battery.id = 0;
              battery.battery_remaining = 80;
              std::fill(std::begin(battery.voltages), std::end(battery.voltages), UINT16_MAX);
              std::fill(std::begin(battery.voltages_ext), std::end(battery.voltages_ext), UINT16_MAX);
              battery.voltages[0] = 12000;
              mavlink_message_t batteryMsg;
              mavlink_msg_battery_status_encode(1, MAV_COMP_ID_AUTOPILOT1, &batteryMsg, &battery);
              ingestFrame(bridge, batteryMsg, 2000);

              MavlinkBatterySnapshot snap;
              TEST_ASSERT_TRUE(bridge.getBatterySnapshot(2001, snap));
              TEST_ASSERT_TRUE(snap.hasLevel);
              TEST_ASSERT_TRUE(snap.hasVoltage);
              TEST_ASSERT_EQUAL_UINT8(80, snap.level);
              TEST_ASSERT_FLOAT_WITHIN(0.001f, 12.0f, snap.voltage);

              mavlink_high_latency2_t hl{};
              hl.battery = 70;
              mavlink_message_t hlMsg;
              mavlink_msg_high_latency2_encode(1, MAV_COMP_ID_AUTOPILOT1, &hlMsg, &hl);
              const uint32_t hlTime = 2000 + MavlinkBridge::BATTERY_STALENESS_MS - 1000;
              ingestFrame(bridge, hlMsg, hlTime);

              const uint32_t queryTime = 2000 + MavlinkBridge::BATTERY_STALENESS_MS + 1000;
              TEST_ASSERT_TRUE(bridge.getBatterySnapshot(queryTime, snap));
              TEST_ASSERT_TRUE(snap.hasLevel);
              TEST_ASSERT_FALSE(snap.hasVoltage);
              TEST_ASSERT_EQUAL_UINT8(70, snap.level);
          }

          void setUp(void) {}
          void tearDown(void) {}

          void setup()
          {
              initializeTestEnvironment();
              UNITY_BEGIN();
              RUN_TEST(test_configured_peer_is_immediate_and_exclusive);
              RUN_TEST(test_zero_peer_keeps_first_sender_discovery);
              RUN_TEST(test_high_latency_level_does_not_refresh_stale_voltage);
              exit(UNITY_END());
          }

          void loop() {}

          #else

          void setUp(void) {}
          void tearDown(void) {}
          void setup()
          {
              initializeTestEnvironment();
              UNITY_BEGIN();
              exit(UNITY_END());
          }
          void loop() {}

          #endif
          '''.replace("          ", ""))

          count_path = Path("test/native-suite-count")
          count = int(count_path.read_text().strip())
          count_path.write_text(f"{count + 1}\n")
          PY

      - name: Run MAVLink native regression suite
        shell: bash
        run: ./bin/run-tests.sh -f test_mavlink

      - name: Commit integrated firmware change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/mavlink-integrate.yml
          git add .gitmodules protobufs src/mesh/generated src/modules/SerialModule.h src/modules/SerialModule.cpp src/modules/Mavlink/MavlinkBridge.h src/modules/Mavlink/MavlinkBridge.cpp test/test_mavlink test/native-suite-count
          git commit -m "Integrate canonical MAVLink configuration"
          git push origin HEAD:mavlink
