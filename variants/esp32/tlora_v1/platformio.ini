[env:tlora-v1]
custom_meshtastic_hw_model = 2
custom_meshtastic_hw_model_slug = TLORA_V1
custom_meshtastic_architecture = esp32
custom_meshtastic_actively_supported = false
custom_meshtastic_display_name = LILYGO T-LoRa V1
custom_meshtastic_tags = LilyGo

board_level = extra
extends = esp32_base
board = ttgo-lora32-v1
build_flags = 
  ${esp32_base.build_flags}
  -D TLORA_V1
  -D MESHTASTIC_EXCLUDE_MAVLINK=0
  -I variants/esp32/tlora_v1
custom_sdkconfig =
  ${esp32_base.custom_sdkconfig}
  CONFIG_XTAL_FREQ_26=y
  '# CONFIG_XTAL_FREQ_40 is not set'
lib_deps =
  ${esp32_base.lib_deps}
  https://github.com/mavlink/c_library_v2/archive/e54a8d2e8cf7985e689ad1c8c8f37dc0800ea87b.zip
upload_speed = 115200
